[package]
name = "remocn-studio"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "remocn_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
tauri-plugin-updater = "2.10.1"
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.13", features = ["json"] }
# Off by default, and deliberately: nothing in CI compiles this crate — the
# Rust is only ever built by the release job — so an unbuildable dependency
# tree would first be found while cutting a release. `contexts` stays on for
# the os/device context (`server_name` is overridden in `crash.rs`, which is
# the only part of it that is PII); `release-health`, `logs` and `metrics` are
# off because this reports crashes and nothing else.
sentry = { version = "0.49", optional = true, default-features = false, features = [
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "transport",
] }

[features]
default = []
crash-reports = ["dep:sentry"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

